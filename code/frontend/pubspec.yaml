name: intelligent_expense_tracker
description: "Intelligent Expense Tracker - Flutter Mobile App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^14.2.7

  # Charts
  fl_chart: ^0.69.0

  # Image & File picking
  image_picker: ^1.1.2
  file_picker: ^12.1.3

  # Formatting
  intl: ^0.19.0

  # Storage
  shared_preferences: ^2.3.2

  # Typography
  google_fonts: ^6.2.1

  # Animations
  shimmer: ^3.0.0

  # Progress indicators
  percent_indicator: ^4.2.3

  cupertino_icons: ^1.0.8
  receive_sharing_intent: ^1.9.0
  http: ^1.6.0
  lucide_icons_flutter: ^4.0.1
  flutter_local_notifications: ^22.3.3
  flutter_svg: ^2.3.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/

  fonts:
    - family: DMSans
      fonts:
        - asset: assets/font/DMSans/DMSans-Regular.ttf
          weight: 400
        - asset: assets/font/DMSans/DMSans-Medium.ttf
          weight: 500
        - asset: assets/font/DMSans/DMSans-SemiBold.ttf
          weight: 600
        - asset: assets/font/DMSans/DMSans-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/font/JetBrainsMono/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/font/JetBrainsMono/JetBrainsMono-Bold.ttf
          weight: 700
