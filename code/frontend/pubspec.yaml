name: intelligent_expense_tracker
description: "Intelligent Expense Tracker - Flutter Mobile App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^14.2.7

  # Charts
  fl_chart: ^0.69.0

  # Image & File picking
  image_picker: ^1.1.2
  file_picker: ^8.1.2

  # Formatting
  intl: ^0.19.0

  # Storage
  shared_preferences: ^2.3.2

  # Typography
  google_fonts: ^6.2.1

  # Animations
  shimmer: ^3.0.0

  # Progress indicators
  percent_indicator: ^4.2.3

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
