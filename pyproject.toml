[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "intelligent-expense-tracker"
version = "0.1.0"
authors = [
  { name = "Sarwangini Hamal" },
  { name = "Aashi Tyagi" },
  { name = "Gauransh Arora", email = "garora1_be24@thapar.edu" },
  { name = "Divyansh Kumar" },
]
description = "UCS503 Software Engineering - Intelligent Expense Tracker"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Gauransh-Arora/UCS503-202627-Intelligent-Expense-Tracker"
Issues = "https://github.com/Gauransh-Arora/UCS503-202627-Intelligent-Expense-Tracker/issues"

[tool.hatch.build.targets.wheel]
packages = ["code/backend/app"]

[tool.pytest.ini_options]
pythonpath = [
  "code"
]
